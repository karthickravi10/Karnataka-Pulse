<style>
:root{--bg:#f4f6fa;--sf:#fff;--ink:#14213d;--mut:#5d6b82;--line:#d5dce8;--red:#c8102e;--yel:#f2b705;--chip:#e7ecf5;--hd:#14213d;--hdt:#fff;--acc:#1d4ed8;--acct:#fff}
:root[data-theme=dark]{--bg:#0f1114;--sf:#171b21;--ink:#e8eaed;--mut:#8d96a5;--line:#272d37;--red:#ef4b57;--yel:#f5c542;--chip:#232933;--hd:#0b0d10;--hdt:#e8eaed;--acc:#4c8dff;--acct:#06101f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,"Noto Sans Kannada",sans-serif}
.w{max-width:980px;margin:0 auto;padding:0 18px}a{color:inherit}
header{background:var(--hd);color:var(--hdt);border-bottom:3px solid var(--yel)}header .w{display:flex;align-items:center;gap:12px;height:56px}
h1{font-size:19px;margin:0;white-space:nowrap}#today{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px 10px;opacity:1;font-size:12.5px;font-weight:600;white-space:nowrap}.logo{height:38px;width:auto;border-radius:8px;background:#001a3f;flex:none}header .sp{flex:1}header small{opacity:.8;color:inherit}
button,select,input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:6px;padding:5px 10px}button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--yel);outline-offset:1px}
.tabs{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}.tabs .w{display:flex;gap:6px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
.tabs button{border-radius:99px;white-space:nowrap}.tabs button b{opacity:.65;margin-left:4px;font-weight:600}.tabs button.on,.pill.on,#og.on,#rbtn:active,#rf:active{background:var(--acc);color:var(--acct);border-color:var(--acc);font-weight:600}#og.on::before{content:"\2713  "}button:active{transform:scale(.97)}
.flt{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}.flt .sc{display:flex;gap:4px}
h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
#top .sc2{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.tc{flex:0 0 min(300px,82%);scroll-snap-align:start;background:var(--sf);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.tc .th img{width:100%;height:130px;object-fit:cover;display:block}.tc div.in{padding:10px 12px}.tc b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;margin:4px 0}
small,.mt,.ot{color:var(--mut);font-size:12.5px}
.row{display:grid;grid-template-columns:26px 150px 1fr;gap:14px;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row.single{border-style:dashed}.row.new{box-shadow:inset 4px 0 0 var(--red)}.n{color:var(--mut);font-weight:700;padding-top:2px}
.th img{width:150px;height:100px;object-fit:cover;border-radius:8px;display:block;background:var(--chip)}.row:not(.hasimg){grid-template-columns:26px 1fr}
.mt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.cat{background:var(--yel);color:#14213d;border-radius:4px;padding:0 6px;font-size:11px}
.lg{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;letter-spacing:.5px}.nw{background:var(--red);color:#fff;border-radius:4px;padding:0 6px;font-size:11px}
.row h2{margin:3px 0;font-size:18px;line-height:1.3}.row h2 a{text-decoration:none}.row h2 a:hover{text-decoration:underline}.orig{margin:0 0 4px;color:var(--mut);font-size:13.5px}.sum{margin:4px 0 8px}
.ot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.av{width:24px;height:24px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:inline-grid;place-items:center;margin-right:-8px;border:2px solid var(--sf)}.ot .t{margin-left:10px}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}details ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
details li{border-left:3px solid var(--line);padding-left:10px;font-size:14px}details li small{display:block}
.desc{margin:8px 0}.desc>summary{cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:13px;list-style:none}.desc>summary::-webkit-details-marker{display:none}.desc>summary::before{content:"\25B8"}.desc[open]>summary::before{content:"\25BE"}.dbody{margin-top:8px}.tbtn{font-size:12px;padding:1px 9px;margin:0 0 8px;color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 0}footer{padding-bottom:60px}.pill{border-radius:99px}

[hidden]{display:none!important}body.tv .feedonly{display:none!important}
