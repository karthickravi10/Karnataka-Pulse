name: update-news
on:
  schedule: [{ cron: '*/20 * * * *' }]
  workflow_dispatch:
concurrency: update-news
env:
  PROJECT: karnataka-pulse   # your Cloudflare Pages project name
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: state/news.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: node build.mjs
        env: { CF_AI_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CF_ACCOUNT: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}', AZURE_KEY: '${{ secrets.AZURE_TRANSLATOR_KEY }}', AZURE_REGION: '${{ secrets.AZURE_TRANSLATOR_REGION }}' }
      - run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main || true
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
      - run: npx --yes wrangler@3 pages deploy site --project-name "$PROJECT" --branch main
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' }
